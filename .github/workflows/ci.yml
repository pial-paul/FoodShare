name: Verify FoodShare
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        database: ["mysql:8.4", "mariadb:10.11"]
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_DATABASE: foodshare_test
          MYSQL_USER: foodshare_ci
          MYSQL_PASSWORD: ephemeral-ci-only
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 || mariadb-admin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check runtime
        run: |
          php --version
          php -r 'foreach (["mysqli","mbstring","fileinfo","mysqlnd"] as $e) { if (!extension_loaded($e)) { fwrite(STDERR,"Missing $e\n"); exit(1); } }'
          node --version
      - name: PHP syntax
        run: git ls-files -z '*.php' | xargs -0 -n1 php -l
      - name: Exercise the web application and upgrade path
        env:
          FOODSHARE_DB_NAME: foodshare_test
          FOODSHARE_DB_USER: foodshare_ci
          FOODSHARE_DB_PASSWORD: ephemeral-ci-only
          FOODSHARE_DB_PORT: ${{ job.services.database.ports[3306] }}
        run: node --test tests/handoffs.test.mjs
